[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-sql-assistant"
version = "0.1.0"
description = "Agentic text-to-SQL analytics assistant built on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langsmith>=0.4",
  "psycopg[binary]>=3.2",
  "sqlglot>=25",
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "plotly>=5.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]
ui = ["streamlit>=1.40", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL warehouse (WAREHOUSE_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom; E501: the formatter owns line length
